openapi: 3.0.3
info:
  title: QA Study Tracker API
  version: 1.0.0
  description: Initial REST API structure with JWT authentication and MongoDB.
servers:
  - url: http://localhost:3000
    description: Local environment
tags:
  - name: Health
  - name: Auth
  - name: Courses
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check endpoint
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: qa-study-tracker-api
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPayload"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already in use
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user and return JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPayload"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Invalid or missing token
  /api/courses/{id}:
    get:
      tags: [Courses]
      summary: Get a course by id for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Course identifier
      responses:
        "200":
          description: Course found
          content:
            application/json:
              schema:
                type: object
                properties:
                  course:
                    $ref: "#/components/schemas/Course"
        "401":
          description: Invalid or missing token
        "403":
          description: Course belongs to another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterPayload:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Rodrigo Elias
        email:
          type: string
          format: email
          example: rodrigo@email.com
        password:
          type: string
          minLength: 6
          example: secret123
    LoginPayload:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: rodrigo@email.com
        password:
          type: string
          example: secret123
    User:
      type: object
      properties:
        id:
          type: string
          example: 6809a1f9142bdf3d4cbf3f1a
        name:
          type: string
          example: Rodrigo Elias
        email:
          type: string
          example: rodrigo@email.com
    Course:
      type: object
      properties:
        id:
          type: string
          example: 68190f9868e2f8b96e436a09
        userId:
          type: string
          example: 68190f6b68e2f8b96e436a08
        name:
          type: string
          example: API Testing
        link:
          type: string
          example: https://example.com/course
        totalWorkloadHours:
          type: number
          example: 30
        status:
          type: string
          example: planned
        registrationDate:
          type: string
          format: date-time
          example: "2026-05-02T00:00:00.000Z"
        createdAt:
          type: string
          format: date-time
          example: "2026-05-02T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-02T10:00:00.000Z"
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Course not found
        code:
          type: string
          example: RESOURCE_NOT_FOUND
